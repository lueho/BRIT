{% load cache atlas_navigation %}
<div class="atlas-tree-head">
  <label class="visually-hidden" for="atlas-tree-filter">Filter maps</label>
  <input id="atlas-tree-filter"
         class="atlas-tree-filter form-control form-control-sm"
         type="search"
         autocomplete="off"
         placeholder="Filter maps…">
</div>
<div class="atlas-tree-scroll">
  {% cache 3600 atlas_shell_tree atlas_tree_overview_active directory_selected_region atlas_map_set atlas_active_theme atlas_urlconf %}
  {% atlas_shell_tree %}
  {% endcache %}
</div>
