{% if request.user.is_authenticated %}
  <div class="atlas-selector-field">
    <label for="sel-scope">Collection scope</label>
    <select id="sel-scope">
      <option value="published" {% if atlas_scope == "published" %}selected{% endif %}>Published</option>
      <option value="mine" {% if atlas_scope == "mine" %}selected{% endif %}>My workspace</option>
      <option value="owned" {% if atlas_scope == "owned" %}selected{% endif %}>Owned</option>
      <option value="shared" {% if atlas_scope == "shared" %}selected{% endif %}>Shared</option>
      {% if atlas_active_actor %}
        <option value="review" {% if atlas_scope == "review" %}selected{% endif %}>Review</option>
      {% endif %}
      {% if atlas_administrator %}
        <option value="all" {% if atlas_scope == "all" %}selected{% endif %}>All</option>
      {% endif %}
    </select>
  </div>
{% endif %}
