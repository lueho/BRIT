{% if atlas_is_active_actor %}
  <div class="atlas-selector-field">
    <label for="sel-scope">Collection scope</label>
    <select id="sel-scope">
      {% for value, label in atlas_scope_options %}
        <option value="{{ value }}" {% if atlas_scope == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
      {% if not atlas_scope_available %}
        <option value="{{ atlas_scope }}" selected disabled>Unavailable scope</option>
      {% endif %}
    </select>
    <small class="atlas-selector-help">Historical shows everything published,
      including archived records. Published shows only currently active
      records.</small>
  </div>
{% endif %}
