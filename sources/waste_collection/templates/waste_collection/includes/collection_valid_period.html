{% load i18n %}
<span class="d-block text-muted small">
    {% trans "Valid period" %}:
    <time datetime="{{ collection.valid_from|date:'Y-m-d' }}">{{ collection.valid_from|date:"d.m.Y" }}</time>
    –
    {% if collection.valid_until %}
        <time datetime="{{ collection.valid_until|date:'Y-m-d' }}">{{ collection.valid_until|date:"d.m.Y" }}</time>
    {% else %}
        {% trans "No end date" %}
    {% endif %}
</span>
