build:
  docker:
    web: Dockerfile
  config:
    INSTALL_DEV: false
    INSTALL_PDF_PARSING: false
release:
  image: web
  command:
    - sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput'
run:
  # Container deploys don't get WEB_CONCURRENCY, so gunicorn defaulted to a
  # single sync worker: one slow request queued everything behind it until
  # Heroku's 30s router timeout cut in (H12 storm during the Oct 2026 crawler
  # burst). 2 workers x 2 threads fits the Standard-1X quota (~450MB of 512MB)
  # and isolates CPU-bound renders from cheap requests.
  web: gunicorn $DJANGO_WSGI --bind 0.0.0.0:$PORT --workers 2 --threads 2 --access-logfile - --error-logfile -
  worker:
    image: web
    command:
      # --beat embeds the scheduler so CELERY_BEAT_SCHEDULE entries (e.g.
      # periodic GeoJSON cache warmup) actually fire. Only valid while a
      # single worker dyno runs; split beat out if workers scale beyond one.
      - celery --app=brit worker --loglevel=info --concurrency=1 --beat --schedule /tmp/celerybeat-schedule
