{% load moderation_tags %}
<nav class="sdv2-context-nav" aria-label="Sample navigation">
  {% safe_back_url as back_url %}
  {% if back_url %}
    <a class="sdv2-btn sdv2-btn-ghost" href="{{ back_url }}">
      <i class="fas fa-arrow-left" aria-hidden="true"></i> Back to results
    </a>
  {% endif %}
  <a class="sdv2-btn sdv2-btn-ghost" href="{{ public_url }}?scope=published">
    <i class="fas fa-list" aria-hidden="true"></i> All samples
  </a>
  <a class="sdv2-btn sdv2-btn-ghost" href="{{ public_gallery_url }}?scope=published">
    <i class="fas fa-image" aria-hidden="true"></i> Featured samples
  </a>
  <a class="sdv2-btn sdv2-btn-ghost" href="{% url 'materials-explorer' %}">
    <i class="fas fa-table-cells-large" aria-hidden="true"></i> Materials explorer
  </a>
</nav>
