{% extends "simple_form_card.html" %}

{% block extra_post_form_content %}
    <div id="algorithmChoiceContainer" class="form-group"></div>
    <div id="parameterFormContainer" class="form-group"></div>
{% endblock extra_post_form_content %}

{% block cancel_button %}
    <a href="{{ view.get_success_url }}" class="btn btn-secondary">Cancel</a>
{% endblock cancel_button %}

{% block javascript %}
    {{ block.super }}

    <script nonce="{{ csp_nonce }}">
        const form = document.getElementById("parameterFormContainer").closest("form");

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text == null ? "" : String(text);
            return div.innerHTML.replace(/"/g, "&quot;");
        }

        function renderParameterFields(parameters) {
            if (!parameters || parameters.length === 0) {
                document.getElementById("parameterFormContainer").innerHTML = "";
                return;
            }

            let html = "<h3>Parameters for this algorithm:</h3>";
            for (const param of parameters) {
                const allowsCustom = param.values.length === 0 || param.values.every(v => v.type === 1);
                html += `
                    <div id="div_id_parameter_${param.id}" class="form-group">
                        <label class="requiredField" for="id_parameter_${param.id}">${escapeHtml(param.descriptive_name)}</label>
                        <div>
                            <select id="id_parameter_${param.id}" class="select form-control" name="parameter_${param.id}">
                                <option value="">---------</option>
                                ${param.values.map(v => `<option value="${v.id}"${v.default ? ' selected' : ''}>${escapeHtml(v.name || v.value)}${v.source ? ` (${escapeHtml(v.source)})` : ''}</option>`).join('')}
                                ${allowsCustom ? '<option value="custom">Custom value (own assumption)</option>' : ''}
                            </select>
                        </div>
                    </div>
                    ${allowsCustom ? `
                    <div id="div_id_parameter_${param.id}_custom" class="form-group" style="display: none; margin-left: 1.5rem;">
                        <label for="id_parameter_${param.id}_custom_value">Own value${param.unit ? ` (${escapeHtml(param.unit)})` : ''}</label>
                        <input type="number" step="any" id="id_parameter_${param.id}_custom_value" class="form-control" name="parameter_${param.id}_custom_value">
                        <label for="id_parameter_${param.id}_custom_standard_deviation">Standard deviation (optional)</label>
                        <input type="number" step="any" id="id_parameter_${param.id}_custom_standard_deviation" class="form-control" name="parameter_${param.id}_custom_standard_deviation">
                        <label for="id_parameter_${param.id}_custom_source">Source or basis of assumption (optional)</label>
                        <input type="text" maxlength="200" id="id_parameter_${param.id}_custom_source" class="form-control" name="parameter_${param.id}_custom_source">
                    </div>` : ''}
                `;
            }
            document.getElementById("parameterFormContainer").innerHTML = html;
            for (const param of parameters) {
                const select = document.getElementById(`id_parameter_${param.id}`);
                if (select) {
                    select.addEventListener("change", () => toggleCustomInputs(param.id));
                }
            }
        }

        function toggleCustomInputs(parameterId) {
            const select = document.getElementById(`id_parameter_${parameterId}`);
            const container = document.getElementById(`div_id_parameter_${parameterId}_custom`);
            const valueInput = document.getElementById(`id_parameter_${parameterId}_custom_value`);
            if (!select || !container || !valueInput) {
                return;
            }
            const isCustom = select.value === "custom";
            container.style.display = isCustom ? "" : "none";
            valueInput.required = isCustom;
        }

        function addKwargRow(preset) {
            const rows = document.getElementById("kwargRows");
            if (!rows) {
                return;
            }
            const row = document.createElement("div");
            row.className = "kwarg-row form-row mb-2";
            row.innerHTML = `
                <input type="text" class="form-control" name="kwarg_name"
                       placeholder="Factor name (e.g. area_yield)" maxlength="28"
                       pattern="[A-Za-z_]\\w{0,27}" required>
                <input type="number" step="any" class="form-control" name="kwarg_value"
                       placeholder="Value" required>
                <input type="number" step="any" class="form-control" name="kwarg_standard_deviation"
                       placeholder="Std. dev. (optional)">
                <input type="text" class="form-control" name="kwarg_unit"
                       placeholder="Unit (e.g. kg / year, percent)" maxlength="40">
                <button type="button" class="btn btn-outline-danger remove-kwarg">Remove</button>
            `;
            if (preset) {
                const inputs = row.querySelectorAll("input");
                inputs[0].value = preset.name;
                inputs[1].value = preset.value;
                inputs[2].value = preset.standardDeviation ?? "";
                inputs[3].value = preset.unit ?? "";
            }
            row.querySelector(".remove-kwarg").addEventListener("click", () => row.remove());
            rows.appendChild(row);
        }

        let genericFunctions = [];

        function renderPresetPicker(baseKind) {
            const fn = genericFunctions.find(f => f.base_kind === baseKind);
            const parameters = fn ? fn.parameters || [] : [];
            const options = [];
            for (const param of parameters) {
                for (const value of param.values || []) {
                    const label = `${param.short_name} = ${value.name || value.value}` +
                        `${value.source ? ` (${value.source})` : ""}`;
                    options.push(
                        `<option value="${value.id}">${escapeHtml(label)}</option>`
                    );
                }
            }
            if (!options.length) {
                return "";
            }
            return `
                <div class="form-group">
                    <label for="id_preset_factor">Add a preset factor (optional)</label>
                    <select id="id_preset_factor" class="select form-control">
                        <option value="">-- choose a preset --</option>
                        ${options.join("")}
                    </select>
                </div>
            `;
        }

        function onPresetSelect() {
            const select = document.getElementById("id_preset_factor");
            if (!select || !select.value) {
                return;
            }
            // Factor ids are unique, while one name can occur with several units.
            const baseKind = document.getElementById("id_algorithm_choice").value.substring(7);
            const fn = genericFunctions.find(f => f.base_kind === baseKind);
            for (const param of (fn ? fn.parameters || [] : [])) {
                const value = (param.values || []).find(v => String(v.id) === select.value);
                if (value) {
                    addKwargRow({
                        name: param.short_name,
                        value: value.value,
                        standardDeviation: value.standard_deviation,
                        unit: param.unit,
                    });
                    break;
                }
            }
            select.value = "";
        }

        let datasetColumns = [];

        let numericColumns = [];
        let filterOperators = [];

        function renderBaseColumn(baseKind) {
            if (baseKind !== "column_sum") {
                return "";
            }
            const options = numericColumns
                .map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`)
                .join("");
            return `
                <h3>Base quantity</h3>
                <p class="text-muted">The values of this column are summed over the
                    features inside the catchment.</p>
                <div class="form-row mb-2">
                    <select id="id_base_column" class="select form-control" name="base_column" required>
                        <option value="">-- column --</option>${options}
                    </select>
                    <input type="text" class="form-control" name="base_unit" maxlength="40"
                           placeholder="Unit of the column (optional, e.g. hectare)">
                </div>
            `;
        }

        function renderFeatureFilter() {
            if (!datasetColumns.length) {
                return "";
            }
            const options = datasetColumns
                .map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`)
                .join("");
            const operators = filterOperators
                .map(o => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`)
                .join("");
            return `
                <h3>Feature filter (optional)</h3>
                <p class="text-muted">Restrict the inventory to a subset of features —
                    e.g. one crop of a parcels dataset. Separate several values with commas
                    for “is one of”.</p>
                <div class="form-row mb-2">
                    <select id="id_filter_column" class="select form-control" name="filter_column">
                        <option value="">-- all features --</option>${options}
                    </select>
                    <select id="id_filter_operator" class="select form-control" name="filter_operator">
                        ${operators}
                    </select>
                    <input type="text" id="id_filter_value" class="form-control" name="filter_value"
                           list="id_filter_value_options" maxlength="255" placeholder="Value" disabled>
                    <datalist id="id_filter_value_options"></datalist>
                </div>
            `;
        }

        function onFilterColumnChange() {
            const columnSelect = document.getElementById("id_filter_column");
            const valueInput = document.getElementById("id_filter_value");
            const valueOptions = document.getElementById("id_filter_value_options");
            const column = datasetColumns.find(c => c.name === columnSelect.value);
            valueInput.value = "";
            if (!column) {
                valueOptions.innerHTML = "";
                valueInput.disabled = true;
                valueInput.required = false;
                return;
            }
            valueOptions.innerHTML = (column.values || [])
                .map(v => `<option value="${escapeHtml(v)}"></option>`)
                .join("");
            valueInput.disabled = false;
            valueInput.required = true;
        }

        function renderKwargEditor(baseKind) {
            const container = document.getElementById("parameterFormContainer");
            container.innerHTML = `
                ${renderBaseColumn(baseKind)}
                ${renderFeatureFilter()}
                <h3>Factors</h3>
                <p class="text-muted">The base quantity is multiplied by each factor,
                    e.g. a yield per feature or hectare and a collectable share.
                    Together they have to give a mass per year, so at least one factor
                    needs a unit such as <code>kg / year</code> or
                    <code>kg / hectare / year</code>.</p>
                ${renderPresetPicker(baseKind)}
                <div id="kwargRows"></div>
                <button type="button" id="addKwarg" class="btn btn-outline-primary">Add factor</button>
            `;
            document.getElementById("addKwarg").addEventListener("click", () => addKwargRow());
            const filterColumn = document.getElementById("id_filter_column");
            if (filterColumn) {
                filterColumn.addEventListener("change", onFilterColumnChange);
            }
            const presetSelect = document.getElementById("id_preset_factor");
            if (presetSelect) {
                presetSelect.addEventListener("change", onPresetSelect);
            }
            // Leave the factor list empty until a factor is explicitly added —
            // factor-free and preset-only configurations must stay submittable.
        }

        async function loadRegisteredAlgorithmParameters(algorithmId) {
            const url = `/inventories/api/inventory-algorithms/${algorithmId}/parameters/?scenario={{ scenario.pk }}`;
            try {
                const response = await fetch(url);
                if (response.ok) {
                    renderParameterFields(await response.json());
                }
            } catch (err) {
                console.error("Error loading parameters:", err);
            }
        }

        function onAlgorithmChoiceChange() {
            const select = document.getElementById("id_algorithm_choice");
            const value = select ? select.value : "";
            if (value.startsWith("stream:")) {
                renderKwargEditor(value.substring(7));
            } else if (value.startsWith("algo:")) {
                loadRegisteredAlgorithmParameters(value.substring(5));
            } else {
                document.getElementById("parameterFormContainer").innerHTML = "";
            }
        }

        function renderAlgorithmChoices(data) {
            const container = document.getElementById("algorithmChoiceContainer");
            datasetColumns = data.columns || [];
            numericColumns = data.numeric_columns || [];
            filterOperators = data.filter_operators || [];
            genericFunctions = data.functions || [];
            const generic = genericFunctions;
            const registered = data.algorithms || [];
            if (generic.length === 0 && registered.length === 0) {
                container.innerHTML =
                    '<p class="text-muted">No inventory method can be applied to this dataset.</p>';
                document.getElementById("parameterFormContainer").innerHTML = "";
                return;
            }
            let options = '<option value="">---------</option>';
            if (generic.length > 0) {
                options += '<optgroup label="Base quantity × factors">';
                for (const fn of generic) {
                    options += `<option value="stream:${escapeHtml(fn.base_kind)}">${escapeHtml(fn.name)}</option>`;
                }
                options += "</optgroup>";
            }
            if (registered.length > 0) {
                options += '<optgroup label="Dataset algorithms">';
                for (const algo of registered) {
                    options += `<option value="algo:${algo.id}">${escapeHtml(algo.name)}</option>`;
                }
                options += "</optgroup>";
            }
            container.innerHTML = `
                <label class="requiredField" for="id_algorithm_choice">Inventory method</label>
                <select id="id_algorithm_choice" class="select form-control" name="algorithm_choice" required>
                    ${options}
                </select>
            `;
            document
                .getElementById("id_algorithm_choice")
                .addEventListener("change", onAlgorithmChoiceChange);
            document.getElementById("parameterFormContainer").innerHTML = "";
        }

        async function loadAlgorithmChoices() {
            const geodatasetField = document.getElementById("id_geodataset");
            const feedstockField = document.getElementById("id_feedstock");
            const geodatasetId = geodatasetField ? geodatasetField.value : "";
            if (!geodatasetId) {
                document.getElementById("algorithmChoiceContainer").innerHTML = "";
                document.getElementById("parameterFormContainer").innerHTML = "";
                return;
            }
            let url = `/inventories/api/geodatasets/${geodatasetId}/functions/?scenario={{ scenario.pk }}`;
            if (feedstockField && feedstockField.value) {
                url += `&feedstock=${feedstockField.value}`;
            }
            try {
                const response = await fetch(url);
                if (response.ok) {
                    renderAlgorithmChoices(await response.json());
                }
            } catch (err) {
                console.error("Error loading algorithms:", err);
            }
        }

        for (const fieldId of ["id_geodataset", "id_feedstock"]) {
            const field = document.getElementById(fieldId);
            if (field) {
                field.addEventListener("change", loadAlgorithmChoices);
            }
        }
    </script>

{% endblock javascript %}
