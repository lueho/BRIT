networks:
  full:

services:
  # Dev/CI-only static asset builder (SCSS -> CSS -> minified CSS/JS).
  # Not started by `docker compose up` (guarded by the `assets` profile).
  #   make assets         # one-shot build
  #   make assets-watch   # rebuild on change for live dev feedback
  assets:
    build:
      context: .
      dockerfile: docker/assets/Dockerfile
    image: brit-assets
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
    working_dir: /app
    profiles: ["assets"]

  db:
    image: "postgis/postgis:15-3.4"
    healthcheck:
      # TCP excludes the temporary socket-only server used during first-run init.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 2s
      timeout: 5s
      start_period: 60s
      retries: 60
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - brit_db:/var/lib/postgresql/data/
    env_file:
      - brit/settings/.env
    networks:
      - full

  web:
    build:
      context: .
      # The `dev` target carries no source layer; the checkout is bind-mounted
      # below, so editing source never invalidates the image.
      target: dev
      args:
        INSTALL_DEV: true
        INSTALL_PDF_PARSING: true
    image: brit-web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes: 
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      celery:
        condition: service_started
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"
    env_file:
      - brit/settings/.env
    networks:
      - full

  celery:
    image: brit-web
    volumes: 
      - ./:/app
    # --beat embeds the scheduler so CELERY_BEAT_SCHEDULE entries (e.g.
    # periodic GeoJSON cache warmup) actually fire. Safe here because only
    # one worker container runs per stack; remove it before scaling workers.
    # --schedule keeps the beat state file off the bind-mounted worktree.
    command: celery --app=brit worker --loglevel=info --pool=solo --concurrency=1 --without-gossip --without-mingle --beat --schedule /tmp/celerybeat-schedule -E
    stop_grace_period: 5s
    env_file:
      - brit/settings/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - full
    healthcheck:
      test: ["CMD-SHELL", "celery --app=brit inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    build:
      context: ./docker/redis/
    volumes:
      - ./docker/redis/tests/:/tests
    networks:
      - full

  db_admin:
    build:
      context: ./docker/db_admin/
    env_file:
      - brit/settings/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - full
    profiles: [ "db_admin" ]

  flower:
    image: brit-web
    volumes:
      - ./:/app
    command: celery --app=brit flower
    ports:
      - "5555:5555"
    env_file:
      - brit/settings/.env
    depends_on:
      - web
      - redis
    networks:
      - full
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  brit_db:
