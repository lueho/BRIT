site_name: BRIT Documentation

nav:
  - Home: 01_user_guide/README.md
  - 01_user_guide:
      - User Guide: 01_user_guide/README.md
      - How-tos: 01_user_guide/howtos.md
      - Exporting User-Created Objects: 01_user_guide/file_export.md
  - Developer Guide:
      - Overview: 02_developer_guide/README.md
      - Guidelines: 02_developer_guide/guidelines.md
      - Style Guide: 02_developer_guide/style_guide.md
      - Applications: 02_developer_guide/applications.md
      - API: 02_developer_guide/api.md
      - Architecture:
          - Overview: 02_developer_guide/architecture.md
          - Data Flow: 02_developer_guide/architecture/data_flow.md
          - Deployment: 02_developer_guide/architecture/deployment.md
  - Roadmap:
      - Platform Consolidation: 05_roadmap/README.md

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences

plugins:
  - search

# Development server settings
dev_addr: localhost:8001
