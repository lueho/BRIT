{% load static %}
<article class="discovery-feature sdv2-surface"
         data-feature-slug="{{ feature.slug }}">
  <a class="discovery-feature-cover" href="{% url feature.url_name %}">
    <img src="{% static feature.image_path %}"
         width="{{ feature.image_width }}"
         height="{{ feature.image_height }}"
         alt="{{ feature.image_alt }}">
  </a>
  <div class="discovery-feature-body">
    <div class="discovery-feature-category">
      <i class="fas fa-fw {{ feature.icon }}" aria-hidden="true"></i>{{ feature.category }}
    </div>
    <h3 class="discovery-feature-title">
      <a href="{% url feature.url_name %}">{{ feature.title }}</a>
    </h3>
    <p class="discovery-feature-text">{{ feature.description }}</p>
    {% if feature.logos %}
      <div class="discovery-branding">
        {% for logo in feature.logos %}
          <img class="discovery-logo{% if logo.variant == 'interreg' %} discovery-logo-interreg{% elif logo.variant == 'project-secondary' %} discovery-logo-secondary{% endif %}"
               src="{% static logo.image_path %}"
               width="{{ logo.width }}"
               height="{{ logo.height }}"
               alt="{{ logo.alt }}">
        {% endfor %}
      </div>
    {% endif %}
    <div class="discovery-feature-actions">
      <a class="sdv2-btn sdv2-btn-primary discovery-feature-cta"
         href="{% url feature.url_name %}">{{ feature.cta_label }} <i class="fas fa-arrow-right ms-1" aria-hidden="true"></i></a>
      {% if feature.external_link %}
        <a class="discovery-feature-external"
           href="{{ feature.external_link.url }}"
           target="_blank"
           rel="noopener noreferrer">{{ feature.external_link.label }} <i class="fas fa-external-link-alt" aria-hidden="true"></i><span class="visually-hidden">(opens in a new tab)</span></a>
      {% endif %}
    </div>
  </div>
</article>
