{% load static %}
<article class="discovery-feature sdv2-surface"
         data-feature-slug="{{ feature.slug }}">
  <a class="discovery-feature-cover" href="{% url feature.url_name %}">
    <img src="{% static feature.image_path %}"
         width="{{ feature.image_width }}"
         height="{{ feature.image_height }}"
         alt="{{ feature.image_alt }}">
  </a>
  <div class="discovery-feature-body">
    <div class="discovery-feature-category">{{ feature.category }}</div>
    <h3 class="discovery-feature-title">
      <a href="{% url feature.url_name %}">{{ feature.title }}</a>
    </h3>
    <p>{{ feature.description }}</p>
    {% if feature.logos %}
      <div class="discovery-branding">
        {% for logo in feature.logos %}
          <img class="discovery-logo{% if logo.variant == 'interreg' %} discovery-logo-interreg{% elif logo.variant == 'project-secondary' %} discovery-logo-secondary{% endif %}"
               src="{% static logo.image_path %}"
               width="{{ logo.width }}"
               height="{{ logo.height }}"
               alt="{{ logo.alt }}">
        {% endfor %}
      </div>
    {% endif %}
    <a class="sdv2-btn sdv2-btn-primary discovery-feature-cta"
       href="{% url feature.url_name %}">{{ feature.cta_label }}</a>
  </div>
</article>
